<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="1120" height="640" fill="#ffffff"/>

  <text x="560" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">Relay — architecture</text>
  <text x="560" y="54" text-anchor="middle" fill="#6b7280">Fragments of speech in → complete sentences out → spoken, and acted on. Built on Strands Agents.</text>

  <!-- Column headers -->
  <text x="150" y="92" text-anchor="middle" font-weight="600" fill="#374151">SURFACES</text>
  <text x="560" y="92" text-anchor="middle" font-weight="600" fill="#374151">RELAY SERVER (FastAPI)</text>
  <text x="980" y="92" text-anchor="middle" font-weight="600" fill="#374151">PROVIDERS</text>

  <!-- Surfaces -->
  <g>
    <rect x="40" y="110" width="220" height="118" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="150" y="134" text-anchor="middle" font-weight="600" fill="#111827">Web app (React PWA)</text>
    <text x="52" y="156" fill="#374151">• Mic: raw PCM + silence detection</text>
    <text x="52" y="174" fill="#374151">• Live call view, Say view, Done view</text>
    <text x="52" y="192" fill="#374151">• Tap a sentence → spoken aloud</text>
    <text x="52" y="210" fill="#374151">• Keys 1–4 pick a suggestion</text>
  </g>
  <g>
    <rect x="40" y="250" width="220" height="118" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="150" y="274" text-anchor="middle" font-weight="600" fill="#111827">Telegram bot</text>
    <text x="52" y="296" fill="#374151">• Voice notes from family → replies</text>
    <text x="52" y="314" fill="#374151">• Inline mode in any chat</text>
    <text x="52" y="332" fill="#374151">• Tap a button → delivered to them</text>
    <text x="52" y="350" fill="#374151">• Long-polling, no public URL</text>
  </g>
  <g>
    <rect x="40" y="390" width="220" height="70" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="150" y="414" text-anchor="middle" font-weight="600" fill="#9a3412">Simulated call partner</text>
    <text x="52" y="436" fill="#374151">Receptionist / pharmacy / son —</text>
    <text x="52" y="452" fill="#374151">one question at a time, realistic pace</text>
  </g>

  <!-- Server core -->
  <rect x="330" y="110" width="460" height="470" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 4"/>

  <!-- Speech in -->
  <g>
    <rect x="350" y="130" width="200" height="62" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="450" y="152" text-anchor="middle" font-weight="600" fill="#3730a3">Speech in</text>
    <text x="450" y="170" text-anchor="middle" fill="#374151">Whisper + vocabulary hint</text>
    <text x="450" y="185" text-anchor="middle" fill="#6b7280">hallucination filter</text>
  </g>

  <!-- Speech out -->
  <g>
    <rect x="570" y="130" width="200" height="62" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="670" y="152" text-anchor="middle" font-weight="600" fill="#3730a3">Speech out</text>
    <text x="670" y="170" text-anchor="middle" fill="#374151">Neural TTS, two voices</text>
    <text x="670" y="185" text-anchor="middle" fill="#6b7280">browser voices as fallback</text>
  </g>

  <!-- Prediction loop -->
  <g>
    <rect x="350" y="212" width="420" height="96" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="560" y="234" text-anchor="middle" font-weight="600" fill="#92400e">Prediction loop — Strands Agent, structured output, no tools</text>
    <text x="362" y="256" fill="#374151">Fragments + tapped words + who she is talking to + what was just said</text>
    <text x="362" y="274" fill="#374151">→ 4 candidate sentences, different intents, honest confidence. One call, 8 s deadline.</text>
    <text x="362" y="292" fill="#374151">Guard: a word she clearly said is always on screen; never invents facts.</text>
  </g>

  <!-- Executor -->
  <g>
    <rect x="350" y="328" width="420" height="96" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="560" y="350" text-anchor="middle" font-weight="600" fill="#14532d">Action executor — Strands Agent with @tool loop</text>
    <text x="362" y="372" fill="#374151">Runs once she commits. Model decides which tools, in what order:</text>
    <text x="362" y="390" fill="#374151">send_document · send_message  (real, via Telegram)</text>
    <text x="362" y="408" fill="#374151">set_reminder · place_call · order_item  (simulated, logged per session)</text>
  </g>

  <!-- Partner + memory + offline row -->
  <g>
    <rect x="350" y="444" width="130" height="118" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="415" y="466" text-anchor="middle" font-weight="600" fill="#9a3412">Call partner</text>
    <text x="415" y="486" text-anchor="middle" fill="#374151">Strands Agent</text>
    <text x="415" y="502" text-anchor="middle" fill="#374151">structured output</text>
    <text x="415" y="518" text-anchor="middle" fill="#374151">persona prompt</text>
    <text x="415" y="540" text-anchor="middle" fill="#6b7280">scripted lines</text>
    <text x="415" y="554" text-anchor="middle" fill="#6b7280">when offline</text>
  </g>
  <g>
    <rect x="495" y="444" width="130" height="118" rx="8" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="560" y="466" text-anchor="middle" font-weight="600" fill="#0c4a6e">Phrasebook</text>
    <text x="560" y="486" text-anchor="middle" fill="#374151">every chosen</text>
    <text x="560" y="502" text-anchor="middle" fill="#374151">sentence remembered</text>
    <text x="560" y="518" text-anchor="middle" fill="#374151">fuzzy recall by sound</text>
    <text x="560" y="540" text-anchor="middle" fill="#6b7280">AgentCore Memory</text>
    <text x="560" y="554" text-anchor="middle" fill="#6b7280">or local JSON</text>
  </g>
  <g>
    <rect x="640" y="444" width="130" height="118" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="705" y="466" text-anchor="middle" font-weight="600" fill="#7f1d1d">Offline engine</text>
    <text x="705" y="486" text-anchor="middle" fill="#374151">pattern-matched</text>
    <text x="705" y="502" text-anchor="middle" fill="#374151">emergency rules</text>
    <text x="705" y="518" text-anchor="middle" fill="#374151">her words verbatim</text>
    <text x="705" y="540" text-anchor="middle" fill="#6b7280">any error or timeout</text>
    <text x="705" y="554" text-anchor="middle" fill="#6b7280">lands here, never blank</text>
  </g>

  <!-- Providers -->
  <g>
    <rect x="860" y="110" width="240" height="150" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="980" y="134" text-anchor="middle" font-weight="600" fill="#111827">Model providers (via Strands)</text>
    <text x="872" y="158" fill="#374151">Amazon Bedrock</text>
    <text x="872" y="176" fill="#374151">Anthropic</text>
    <text x="872" y="194" fill="#374151">OpenAI</text>
    <text x="872" y="212" fill="#374151">Groq  ← current dev setup</text>
    <text x="872" y="238" fill="#6b7280">Picked from credentials. Two tiers:</text>
    <text x="872" y="252" fill="#6b7280">fast (prediction) · smart (executor)</text>
  </g>
  <g>
    <rect x="860" y="282" width="240" height="70" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="980" y="306" text-anchor="middle" font-weight="600" fill="#111827">Groq audio</text>
    <text x="872" y="328" fill="#374151">whisper-large-v3-turbo (STT)</text>
    <text x="872" y="344" fill="#374151">orpheus (TTS)</text>
  </g>
  <g>
    <rect x="860" y="374" width="240" height="70" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="980" y="398" text-anchor="middle" font-weight="600" fill="#111827">Telegram Bot API</text>
    <text x="872" y="420" fill="#374151">messages and documents land</text>
    <text x="872" y="436" fill="#374151">on real phones</text>
  </g>
  <g>
    <rect x="860" y="466" width="240" height="70" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="980" y="490" text-anchor="middle" font-weight="600" fill="#111827">Amazon Bedrock AgentCore</text>
    <text x="872" y="512" fill="#374151">Memory: phrasebook events +</text>
    <text x="872" y="528" fill="#374151">semantic retrieval (when configured)</text>
  </g>

  <!-- Arrows: surfaces -> server -->
  <line x1="260" y1="150" x2="350" y2="160" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="190" x2="350" y2="250" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="260" y1="300" x2="350" y2="270" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="260" y1="330" x2="350" y2="370" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="425" x2="350" y2="500" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrows: server -> providers -->
  <line x1="770" y1="260" x2="860" y2="190" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="770" y1="376" x2="860" y2="200" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="161" x2="860" y2="310" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="400" x2="860" y2="409" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="625" y1="540" x2="860" y2="505" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Internal arrows -->
  <line x1="560" y1="308" x2="560" y2="328" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="572" y="322" fill="#6b7280" font-size="12">she taps one</text>
  <line x1="705" y1="444" x2="705" y2="310" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="712" y="430" fill="#b91c1c" font-size="12">fallback</text>
  <line x1="560" y1="444" x2="560" y2="310" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="566" y="430" fill="#0369a1" font-size="12">relevant past choices</text>

  <!-- Legend -->
  <rect x="40" y="590" width="14" height="14" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="60" y="602" fill="#374151">latency-critical: one Strands call, no agent loop</text>
  <rect x="380" y="590" width="14" height="14" fill="#dcfce7" stroke="#22c55e"/>
  <text x="400" y="602" fill="#374151">real Strands agent loop with tools</text>
  <line x1="640" y1="597" x2="680" y2="597" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="690" y="602" fill="#374151">the hot path — someone is waiting on the line</text>
</svg>
